name: Validate canonical data and workflow

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test canonical snapshot contract
        run: npm test
      - name: Validate manifest and canonical snapshot
        run: npm run validate
      - name: Syntax-check JavaScript
        shell: bash
        run: |
          find research workflow -name '*.mjs' -print0 | xargs -0 -n1 node --check

